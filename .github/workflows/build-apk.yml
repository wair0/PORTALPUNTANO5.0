name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar sintaxis de JavaScript
        run: |
          node --test tests/*.test.cjs
          node --check app/src/main/assets/ui/js/app.js
          node --check app/src/main/assets/ui/js/bridge.js
          node --check app/src/main/assets/ui/js/screens.js
          node --check app/src/main/assets/ui/js/mock.js
          node --check app/src/main/assets/ui/js/icons.js
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace
      - name: Publicar APK directamente (sin ZIP anidado)
        uses: actions/upload-artifact@v4
        with:
          name: portal-puntano-5-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
